<section id="tab-videos" hidden>
  <div class="head">
    <h2>Vidéos</h2>
    <p class="hint">
      Lues au rendu : la prod ne les affiche qu'une fois le build de la CI déployé.
    </p>
  </div>

  <div class="card pad" aria-label="Ajouter une vidéo">
    <div class="form">
      <div class="field">
        <label for="v-target">Cible</label
        ><select id="v-target" class="w-search"></select>
      </div>
      <div class="field">
        <label for="v-query">Chercher sur la chaîne officielle</label
        ><input id="v-query" class="w-search" placeholder="nom du perso / du boss" />
      </div>
      <button class="btn ghost" id="v-search">Chercher</button>
    </div>
    <div class="cands" id="v-cands"></div>
    <div class="form">
      <div class="field">
        <label for="v-input">URL ou id YouTube</label
        ><input id="v-input" class="w-url" placeholder="https://youtu.be/…" />
      </div>
      <div class="field">
        <label for="v-label">Libellé d'onglet (option)</label><input id="v-label" class="w-text" />
      </div>
      <button class="btn primary" id="v-add">Ajouter</button>
    </div>
  </div>
</section>
