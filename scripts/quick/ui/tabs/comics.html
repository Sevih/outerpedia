<section id="tab-comics" hidden>
  <h2>4-comics</h2>
  <p class="hint">
    Déposé dans le pool éditorial, converti en webp, poussé sur R2 : la galerie lit le manifeste à
    la requête, la galerie les montre aussitôt. Le repli committé suit, CI comprise.
  </p>
  <div class="row">
    <div style="flex: 0 0 160px">
      <label>Langue d'origine</label>
      <select id="k-lang"></select>
    </div>
  </div>
  <div class="drop" id="k-drop">Glisser les planches ici (ou cliquer) — png, jpg, webp</div>
  <input type="file" id="k-file" accept="image/png,image/jpeg,image/webp" multiple hidden />
  <div class="chips" id="k-chips"></div>
  <div class="row"><button class="action" id="k-send">Publier les planches</button></div>
</section>
