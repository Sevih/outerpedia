<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Outerpedia — quick</title>
    <link rel="stylesheet" href="/ui/quick.css" />
    <!-- Une feuille par onglet, chargée par la route statique de `ui-serve.ts`. -->
    <link rel="stylesheet" href="/ui/tabs/coupons.css" />
    <link rel="stylesheet" href="/ui/tabs/comics.css" />
    <link rel="stylesheet" href="/ui/tabs/videos.css" />
    <link rel="stylesheet" href="/ui/tabs/ranks.css" />
    <link rel="stylesheet" href="/ui/tabs/gear.css" />
    <link rel="stylesheet" href="/ui/tabs/discord.css" />
    <link rel="stylesheet" href="/ui/tabs/names.css" />
  </head>
  <body>
    <!-- Menu à deux niveaux : les GROUPES dans l'en-tête, les SECTIONS du groupe
         actif dessous. Les deux rangées sont posées par `lib.js` d'après son
         tableau `GROUPS` ; l'onglet ouvert est celui du hash, sinon la section
         que ce HTML laisse visible (la première). -->
    <header class="top">
      <a class="brand" href="#" title="Outerpedia · quick">
        <span class="logo" aria-hidden="true">q</span>
        <strong>Outerpedia · quick</strong>
      </a>
      <nav class="groups" id="groups" aria-label="Groupes"></nav>
      <div class="status">
        <!-- Pastilles des services : `lib.js` les colore d'après `/api/state`. -->
        <span class="pill" id="svc-r2" title="R2 : état inconnu"><i class="dot"></i>R2</span>
        <span class="pill" id="svc-youtube" title="YouTube : état inconnu"
          ><i class="dot"></i>YouTube</span
        >
        <span class="pill" id="svc-discord" title="Discord : état inconnu"
          ><i class="dot"></i>Discord</span
        >
        <!-- Le seul geste qui pousse : `gitBar` (`lib.js`) y pose le compte des
             commits en attente, d'après `/api/state` puis chaque enregistrement. -->
        <button class="btn primary sm" id="push" title="git : état inconnu" disabled>
          Pousser <span class="badge" id="push-count">0</span>
        </button>
        <span class="env" id="env" title="Le poste qui sert la page, et son port"></span>
        <button class="btn ghost sm" id="quit" title="Arrête le serveur local">Quitter</button>
      </div>
    </header>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>

    <!-- Le journal : une bande dans le flux, entre les sections et le contenu,
         absente au repos. `log()` (`lib.js`) pose son état : UNE ligne tant
         que l'opération court et quand elle passe (un clic la déplie), tout le
         journal (`#log`) et « Copier » quand elle échoue. -->
    <aside class="journal" id="journal" data-state="idle" aria-label="Journal" hidden>
      <div class="journal-in">
        <button class="journal-bar" id="journal-toggle" aria-expanded="false" aria-controls="log">
          <i class="dot" id="journal-dot" aria-hidden="true"></i>
          <span class="journal-last" id="journal-last"></span>
          <span class="journal-title" id="journal-title" hidden>Journal</span>
        </button>
        <button class="btn ghost sm" id="journal-copy" hidden>Copier</button>
        <div id="log" hidden></div>
      </div>
    </aside>

    <main>
      <!-- Une section par onglet : le serveur pose `tabs/<nom>.html` à la place de
           chaque marqueur (cf. `ui-serve.ts`). -->
      <!-- @tab coupons -->
      <!-- @tab comics -->
      <!-- @tab videos -->
      <!-- @tab ranks -->
      <!-- @tab gear -->
      <!-- @tab discord -->
      <!-- @tab names -->
    </main>

    <!-- Chaque section s'inscrit auprès de `lib.js` en se chargeant ; l'ordre des
         imports est celui du menu. -->
    <script type="module">
      import { sections } from '/ui/lib.js';
      import '/ui/tabs/coupons.js';
      import '/ui/tabs/comics.js';
      import '/ui/tabs/videos.js';
      import '/ui/tabs/ranks.js';
      import '/ui/tabs/gear.js';
      import '/ui/tabs/discord.js';
      import '/ui/tabs/names.js';

      sections.start();
    </script>
  </body>
</html>
