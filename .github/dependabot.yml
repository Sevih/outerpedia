version: 2
updates:
  # Mises à jour des dépendances npm (maintenance automatique).
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    # Un seul PR hebdo pour les bumps minor/patch (six PR séparées le 21/08 =
    # six deploys si on les merge une à une). Les majors restent à part.
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    # next 16.3.1 exige @swc/helpers 0.5.23, dont les exports ajoutent une
    # condition "module-sync" → ./esm/. Node 24 la suit même en require(), mais
    # le traçage de la sortie standalone ne copie que ./cjs/ : l'image plante au
    # démarrage (MODULE_NOT_FOUND). Site down le 25/09/2026, next revenu à
    # 16.3.0. Seule cette version est exclue — une 16.3.2 sera proposée, à
    # vérifier en démarrant l'image avant de merger.
    ignore:
      - dependency-name: 'next'
        versions: ['16.3.1']
    commit-message:
      prefix: 'chore(deps)'

  # Mises à jour des actions GitHub utilisées dans les workflows.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'ci(deps)'
