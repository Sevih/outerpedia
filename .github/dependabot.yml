version: 2
updates:
  # Mises à jour des dépendances npm (maintenance automatique).
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    # Un seul PR hebdo pour les bumps minor/patch (six PR séparées le 21/08 =
    # six deploys si on les merge une à une). Les majors restent à part.
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'chore(deps)'

  # Mises à jour des actions GitHub utilisées dans les workflows.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'ci(deps)'
